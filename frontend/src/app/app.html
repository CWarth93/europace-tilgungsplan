<main class="shell">
  <header class="page-header"><p class="eyebrow">FINANZIERUNGSRECHNER</p><h1>Tilgungsplan</h1><p>Darlehen verständlich planen.</p></header>
  <app-loan-form [value]="form" [loading]="loading" [serverErrors]="serverErrors" (calculate)="createPlan($event)" />
  @if (error) { <p class="api-error" data-cy="api-error" role="alert">{{ error }}</p> }
  @if (plan; as result) {
    <section class="results" aria-live="polite">
      <app-repayment-summary [plan]="result" />
      <div class="content-grid"><app-repayment-table [plan]="result" [fixedInterestYears]="form.fixedInterestYears" /><app-balance-chart [plan]="result" /></div>
    </section>
  } @else { <section class="empty-state card"><h2>Dein Tilgungsplan erscheint hier</h2><p>Gib deine Darlehensdaten ein und starte die Berechnung.</p></section> }
</main>
